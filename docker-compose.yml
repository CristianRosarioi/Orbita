version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbita_dev
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: orbita_dev_2026
    ports:
      - '5432:5432'
    volumes:
      - orbita_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbita -d orbita_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  orbita_postgres_data:
    driver: local
